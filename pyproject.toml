[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-video-pipeline"
version = "0.1.0"
description = "Paired file/video ingestion + training scaffold"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "python-multipart==0.0.20",
]

[tool.setuptools]
packages = ["volunteer_portal", "pipeline", "scripts"]
